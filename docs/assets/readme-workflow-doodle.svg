<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">数析算法库运行流程</title>
  <desc id="desc">一张手绘风流程图，表格和字段经过方法清单与执行器，生成指标、表格、图表或新数据。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="ink-wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c6ee5"/>
      <stop offset="1" stop-color="#39a5a0"/>
    </linearGradient>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#243466" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 9 5.5 1 10" fill="none" stroke="#6775bb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .ink { fill: none; stroke: #46527f; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
      .ghost { fill: none; stroke: #7b86bf; stroke-width: 1.2; stroke-linecap: round; opacity: .42; }
      .arrow { fill: none; stroke: #6775bb; stroke-width: 2.6; stroke-linecap: round; marker-end: url(#arrow); }
      .label { fill: #273154; font: 700 21px "Segoe UI", "Microsoft YaHei", sans-serif; }
      .note { fill: #687093; font: 15px "Segoe Print", "KaiTi", cursive; }
      .mono { fill: #4e5e9e; font: 15px Consolas, monospace; }
    </style>
  </defs>

  <rect x="4" y="4" width="1192" height="322" rx="28" fill="url(#paper)" stroke="#dce2fb" stroke-width="2"/>
  <path d="M42 57c46-35 112-38 162-9M997 278c51 18 106 13 155-19" class="ghost" stroke-dasharray="3 9"/>
  <path d="M91 278c19 8 30 4 40-9 12 20 30 25 49 13" class="ghost"/>

  <!-- 输入数据便签 -->
  <g transform="translate(55 82) rotate(-1 115 83)" filter="url(#paper-shadow)">
    <path d="M8 4C66 0 166 3 224 8c4 48 4 106-1 151-61 7-153 8-217 2C2 113 3 54 8 4Z" fill="#fff" stroke="#6573b6" stroke-width="2.5"/>
    <path d="M10 7C72 4 164 6 221 11M7 158c63 4 151 4 213-2" class="ghost"/>
    <text x="24" y="36" class="label">表格与字段</text>
    <path d="M25 54h176M25 81h176M25 108h176M25 135h176M72 54v81M136 54v81" class="ink" stroke-width="1.7"/>
    <circle cx="50" cy="67" r="4" fill="#e6a85c"/>
    <circle cx="105" cy="94" r="4" fill="#3ca6a0"/>
    <circle cx="168" cy="121" r="4" fill="#6b78df"/>
  </g>

  <!-- 方法卡片 -->
  <g transform="translate(357 69) rotate(1.2 120 98)" filter="url(#paper-shadow)">
    <path d="M9 9C74 3 180 5 232 12c7 51 4 128-4 174-62 5-154 3-220-3C4 129 4 61 9 9Z" fill="#fff" stroke="#6573b6" stroke-width="2.5"/>
    <path d="M12 13C78 8 178 9 228 16M10 179c61 5 149 5 214 1" class="ghost"/>
    <text x="26" y="44" class="label">清单里的方法</text>
    <rect x="26" y="65" width="184" height="34" rx="8" fill="#edf0ff" stroke="#abb5ea"/>
    <text x="39" y="87" class="mono">data_overview.basic</text>
    <path d="M28 121h81M28 143h132M28 165h103" class="ink" stroke-width="5" opacity=".24"/>
    <path d="M185 128c9-9 20-7 24 1s-5 17-15 14c-10-3-12-18-2-26" class="ghost"/>
  </g>

  <!-- 执行器 -->
  <g transform="translate(658 86) rotate(-.8 107 79)" filter="url(#paper-shadow)">
    <path d="M7 7c57-5 151-3 207 3 4 43 3 103-2 143-57 6-145 7-205 1C3 111 3 50 7 7Z" fill="#fff" stroke="#6573b6" stroke-width="2.5"/>
    <text x="26" y="43" class="label">Runner / SDK</text>
    <path d="m43 72-19 18 19 18M174 72l19 18-19 18M139 61l-45 61" class="ink" stroke="url(#ink-wash)"/>
    <text x="45" y="141" class="note">校验，再执行</text>
  </g>

  <!-- 结果纸张 -->
  <g transform="translate(928 67) rotate(1.1 107 99)" filter="url(#paper-shadow)">
    <path d="M8 7c54-4 147-1 204 6 4 48 3 123-4 177-55 4-140 2-200-4C4 132 4 60 8 7Z" fill="#fff" stroke="#6573b6" stroke-width="2.5"/>
    <text x="24" y="42" class="label">结构化结果</text>
    <path d="M27 161V71M27 161h166" class="ink" stroke-width="1.7"/>
    <path d="M40 143c24-12 34-49 57-37 20 11 27 30 47 10 16-16 20-39 42-36" fill="none" stroke="#3ca6a0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="97" cy="106" r="5" fill="#e6a85c"/>
    <circle cx="144" cy="116" r="5" fill="#6b78df"/>
    <path d="M42 181h64M119 181h69" class="ghost" stroke-width="5"/>
  </g>

  <!-- 手绘连接线 -->
  <path d="M290 164c22-5 35-4 55 1" class="arrow"/>
  <path d="M602 164c20 4 29 4 44-1" class="arrow"/>
  <path d="M881 163c14-3 22-3 35 1" class="arrow"/>
  <path d="M304 151c11-12 23-14 35-10" class="ghost"/>
  <path d="M611 151c10-8 19-9 27-6" class="ghost"/>

  <!-- 四周随手画的小图形 -->
  <g class="ink" stroke-width="1.8" opacity=".7">
    <path d="m31 39 5 10 11 1-8 7 2 11-10-6-10 6 2-11-8-7 11-1Z"/>
    <path d="M1126 47c7-13 20-14 27-3 6 10-4 23-16 20-13-2-16-19-6-28"/>
    <path d="M1094 245v-37M1112 245v-58M1130 245v-26M1148 245v-48"/>
    <path d="M49 239c16-20 32-20 48 0"/>
    <path d="M47 248c19 7 34 7 52 0"/>
  </g>
  <g fill="#e6a85c">
    <circle cx="325" cy="53" r="4"/><circle cx="635" cy="263" r="4"/><circle cx="897" cy="49" r="4"/>
  </g>
  <g fill="#3ca6a0">
    <circle cx="316" cy="281" r="5"/><circle cx="619" cy="45" r="5"/><circle cx="898" cy="278" r="5"/>
  </g>
  <path d="M497 281c35 12 67 12 100 0" class="ghost" stroke-dasharray="2 8"/>
  <text x="516" y="307" class="note">同一套协议，从本地跑到平台</text>
</svg>
